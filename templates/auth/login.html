{% extends "layout.html" %}

{% block title %}
{{ t.user["enter"] }}
{% endblock %}

{% block body %}
<div class="auth-page centered-box">

    <p class="mb-3" align="center">
        {{ t.user_message["enter"] }}
    </p>
    <div class="auth-box">
    <form method="post" class="auth-form">
        <input type="text" name="username"
               class="form-control mb-2"
               placeholder="{{ t.user["login"] }}" autocomplete="off">

        <input type="password" name="password"
               class="form-control mb-3"
               placeholder="{{ t.user["password"] }}" autocomplete="off">

        <button type="submit" class="btn btn-primary">
            {{ t.user["enter"] }}
        </button>
    </form>
    </div>

    <p class="mt-3" align="center">
        {{ t.user_message["no_account"] }}
        <a href="{{ url_for('auth.register') }}">
            {{ t.user["register"] }}
        </a>
    </p>

</div>
{% endblock %}
