{% extends "layout.html" %}

{% block links %}
<script>
    window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        svg: { fontCache: 'global' }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
{% endblock %}

{% block title %}
{{ t["tasks"] }} - MathMind
{% endblock %}

{% block body %}
<div class="task-page card shadow-sm centered-box">
    <div class="card-body">
        <h1 class="card-title mb-3">
            {{ task.id }}. {{ task_tr.title }}
        </h1>

        <p class="card-text task-description">
            {{ task_tr.description }}
        </p>

        <form
            action="{{ url_for('problems.give_answer', title=task.title) }}"
            method="post"
            class="task-form mt-4"
        >
            <input
                type="text"
                name="answer"
                class="form-control mb-3"
                placeholder="{{ t["answer"] }}"
                autocomplete="off"
            >

            <button type="submit" class="btn btn-success">
                {{ t["send_answer"] }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
